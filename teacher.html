<script>
var H="81feff59496c11374fa9c6d515330afc28e20b593ff96e790cfdd637aaf6a5a5";
async function sha(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
function unlock(){var c=document.getElementById("content");c.innerHTML=decodeURIComponent(escape(atob(document.getElementById("d").textContent.trim())));c.hidden=false;document.getElementById("gate").hidden=true;
 document.getElementById("rs").onclick=function(){try{localStorage.removeItem("kitaEnPlay1")}catch(e){}document.getElementById("rsout").textContent="האיפוס בוצע ✔"};
 document.getElementById("mt").onclick=function(){var o=document.getElementById("mtout"),SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){o.textContent="אין זיהוי דיבור בדפדפן הזה – המשחק ישתמש במצב כוכב.";return}
  var r=new SR();r.lang="en-US";o.textContent="מקשיב… אמרו: apple";r.onresult=function(e){o.textContent="נשמע: "+e.results[0][0].transcript+" ✔"};r.onerror=function(e){o.textContent="שגיאה: "+e.error+" (לבדוק הרשאת מיקרופון / Siri והכתבה)"};try{localStorage.setItem("kitaEnPlay1",JSON.stringify(Object.assign(JSON.parse(localStorage.getItem("kitaEnPlay1")||"{}"),{noMic:false})))}catch(e){}r.start()};}
document.getElementById("gate").onsubmit=async function(e){e.preventDefault();var v=document.getElementById("pw").value.trim().toLowerCase();
 if(await sha(v)===H){try{sessionStorage.setItem("kitaEnT","1")}catch(e){}unlock()}else{document.getElementById("err").hidden=false;document.getElementById("pw").value=""}};
try{if(sessionStorage.getItem("kitaEnT")==="1")unlock()}catch(e){}
</script></body></html>
